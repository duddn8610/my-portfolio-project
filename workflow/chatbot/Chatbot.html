<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Custom Chatbot UI with Sidebar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <h2>채팅 목록</h2>
    <button id="new-chat-btn">+ 새 채팅</button>
    <div id="chat-list"></div>
  </div>

  <div id="main-area">
    <h1>개인비서</h1>
    <div id="chat-window"></div>
    <div id="preview"></div>
    <div id="input-area">
      <textarea id="chat-input" placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)" autocomplete="off" rows="1"></textarea>
	  
      <label>
        📎<input type="file" id="file-input" accept="image/*" hidden />
      </label>
	  
      <button id="send-btn" disabled>전송</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
